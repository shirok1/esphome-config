esphome:
  name: daikin-air-sensor
  friendly_name: "DAIKIN Air Sensor"
  project:
    name: "DAIKIN.BRY88AA151K-PM2005"
    version: "1.0.0"
  name_add_mac_suffix: true

esp32:
  variant: esp32
  framework:
    type: esp-idf

api:
  encryption:
    key: !secret daikin_air_sensor_api_key

ota:
  - platform: esphome
    password: !secret daikin_air_sensor_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "DAIKIN Fallback Hotspot"
    password: !secret daikin_air_sensor_fallback_password

web_server:
  port: 80
  version: 3

captive_portal:

bluetooth_proxy:

logger:

uart:
  - id: cm1106_uart
    rx_pin: 16
    tx_pin: 17
    baud_rate: 9600

i2c:
  - id: pm25_bus
    sda: 23
    scl: 22
    scan: true

output:
  - platform: ledc
    pin: 5
    id: co2led_pwm
  - platform: ledc
    pin: 32
    id: tvocled_pwm
  - platform: ledc
    pin: 33
    id: pm25led_pwm

light:
  - platform: monochromatic
    output: co2led_pwm
    id: co2led
    internal: true
    effects:
      - pulse:
          name: "CO2 Alert"
    default_transition_length: 0s
  - platform: monochromatic
    output: tvocled_pwm
    id: tvocled
    internal: true
    effects:
      - pulse:
          name: "TVOC Alert"
    default_transition_length: 0s
  - platform: monochromatic
    output: pm25led_pwm
    id: pm25led
    internal: true
    effects:
      - pulse:
          name: "PM2.5 Alert"
    default_transition_length: 0s

sensor:
  - platform: cm1106
    uart_id: cm1106_uart
    id: cm1106_id
    co2:
      name: "CO2 Sensor"
      id: co2sensor
      device_class: carbon_dioxide
      state_class: measurement
  - platform: pm2005
    i2c_id: pm25_bus
    address: 0x28
    type: pm2005
    pm_1_0:
      name: "PM1.0 Sensor"
      id: pm10sensor
      device_class: pm1
      state_class: measurement
    pm_2_5:
      name: "PM2.5 Sensor"
      id: pm25sensor
      device_class: pm25
      state_class: measurement
    pm_10_0:
      name: "PM10 Sensor"
      id: pm100sensor
      device_class: pm10
      state_class: measurement
  - platform: adc
    pin: 34
    attenuation: auto
    name: "TVOC Sensor"
    id: tvocsensor
    device_class: volatile_organic_compounds
    unit_of_measurement: "µg/m³"
    accuracy_decimals: 0
    update_interval: 3s
    filters:
      - skip_initial: 12 # tgs2602 sensor needs ~30s+ warm-up
      - median:
      - lambda: |-
          static float min_value = x;
          if (x < min_value) {
            min_value = x;
          }
          float diff = x - min_value;
          if (diff * 3000 * id(tvocmultiply).state > id(tvocmax).state) {
            return id(tvocmax).state;
          } else {
            return diff * 3000 * id(tvocmultiply).state;
          }
  - platform: hdc1080
    i2c_id: pm25_bus
    address: 0x40
    update_interval: 15s
    temperature:
      name: "Temperature Sensor"
      id: temperature
      filters:
        - lambda: return x - id(temperatureoffset).state;
    humidity:
      name: "Humidity Sensor"
      id: humidity
      filters:
        - lambda: return x * id(humiditymultiply).state;
        - clamp:
            max_value: 100
  - platform: wifi_signal
    name: "Wi-Fi Signal"

switch:
  - platform: template
    name: "LED Indicator"
    restore_mode: RESTORE_DEFAULT_OFF
    icon: mdi:led-off
    id: indicator
    optimistic: true

status_led:
  pin: 25

number:
  - platform: template
    name: "Threshold CO2"
    entity_category: "config"
    id: co2threshold
    optimistic: true
    unit_of_measurement: "ppm"
    min_value: 400
    max_value: 5000
    step: 100
    initial_value: 1000
    restore_value: true
  - platform: template
    name: "Threshold PM2.5"
    entity_category: "config"
    id: pm25threshold
    optimistic: true
    unit_of_measurement: "µg/m³"
    min_value: 0
    max_value: 200
    step: 10
    initial_value: 50
    restore_value: true
  - platform: template
    name: "Threshold TVOC"
    entity_category: "config"
    id: tvocthreshold
    optimistic: true
    unit_of_measurement: "µg/m³"
    min_value: 0
    max_value: 10000
    step: 1000
    initial_value: 1000
    restore_value: true
  - platform: template
    name: "TVOC MAX"
    entity_category: "config"
    id: tvocmax
    optimistic: true
    unit_of_measurement: "µg/m³"
    min_value: 3000
    max_value: 10000
    step: 1000
    initial_value: 5000
    restore_value: true
  - platform: template
    name: "TVOC Multiply"
    entity_category: "config"
    id: tvocmultiply
    optimistic: true
    min_value: 0.3
    max_value: 3
    step: 0.05
    initial_value: 1
    restore_value: true
  - platform: template
    name: "Humidity Multiply"
    entity_category: "config"
    id: humiditymultiply
    optimistic: true
    min_value: 0.9
    max_value: 1.1
    step: 0.01
    initial_value: 1
    restore_value: true
  - platform: template
    name: "Temperature Offset"
    entity_category: "config"
    id: temperatureoffset
    optimistic: true
    min_value: -2
    max_value: 3
    step: 0.1
    initial_value: 1
    restore_value: true

binary_sensor:
  - platform: template
    internal: true
    id: tvoclambda
    lambda: return id(indicator).state && id(tvocsensor).state > id(tvocthreshold).state;
    on_press:
      then:
        - light.turn_on:
            id: tvocled
            effect: "TVOC Alert"
    on_release:
      then:
        - light.turn_off: tvocled
  - platform: template
    internal: true
    id: co2lambda
    lambda: return id(indicator).state && id(co2sensor).state > id(co2threshold).state;
    on_press:
      then:
        - light.turn_on:
            id: co2led
            effect: "CO2 Alert"
    on_release:
      then:
        - light.turn_off: co2led
  - platform: template
    internal: true
    id: pm25lambda
    lambda: return id(indicator).state && id(pm25sensor).state > id(pm25threshold).state;
    on_press:
      then:
        - light.turn_on:
            id: pm25led
            effect: "PM2.5 Alert"
    on_release:
      then:
        - light.turn_off: pm25led
  - platform: template
    internal: true
    id: co2_calibration
    lambda: return id(co2sensor).state == 400;
    filters:
      - delayed_on: 5min # CO2 持续 400ppm 并保持 5 分钟会自动校准
    on_press:
      then:
        - cm1106.calibrate_zero: cm1106_id
  - platform: gpio
    pin: 19
    id: RESET
    internal: true
    on_press:
      then:
        - button.press: reset

button:
  - platform: restart
    name: "Restart"
    entity_category: "diagnostic"
  - platform: factory_reset
    id: reset
    internal: true
  - platform: template
    name: "CO2 Calibration" # 按下后会将当前环境 CO2 浓度设置为基准 400ppm，按下时请确保放入室外或此时 CO2 浓度足够低
    entity_category: "diagnostic"
    on_press:
      then:
        - cm1106.calibrate_zero: cm1106_id
